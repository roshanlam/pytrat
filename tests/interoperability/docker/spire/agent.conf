agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "WARN"
    server_address = "127.0.0.1"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_domain = "interop.test"
    # Single-container test stack: server and agent share loopback, so bootstrap trust is local.
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "memory" {
        plugin_data {}
    }
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
