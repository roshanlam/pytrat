name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --all-packages --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Type-check examples
        run: |
          (cd examples/payment-transfer && MYPYPATH=. uv run mypy --strict payment_demo demo.py serve.py)
          (cd examples/agent-delegation && MYPYPATH=. uv run mypy --strict agent_delegation.py)
      - name: Run demos
        run: |
          uv run python examples/payment-transfer/demo.py
          uv run python examples/payment-transfer/serve.py
          uv run python examples/agent-delegation/agent_delegation.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv export --all-packages --frozen --no-hashes --no-emit-workspace > requirements.txt
      - run: uvx pip-audit -r requirements.txt

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 15
    env:
      PYTRAT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run pytest packages/pytrat-redis -q

  compose-smoke:
    name: payment demo on Docker Compose (TLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: docker/setup-buildx-action@v3
      - run: uv sync --all-packages --frozen
      - name: Build, honest transfer 201, tampered transfer 403, teardown
        env:
          PYTRAT_TEST_COMPOSE: "1"
        run: uv run pytest tests/integration/test_payment_compose.py -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen --group docs
      - run: uv run --group docs mkdocs build --strict
