name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"   # nightly
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per harness
        default: "300"
      targets:
        description: Space-separated targets (empty = all)
        default: ""

permissions:
  contents: read

jobs:
  atheris:
    runs-on: ubuntu-latest   # x86-64: Atheris wheels install natively
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group fuzz
      - name: Fuzz
        # Inputs reach the shell only through the environment, never interpolated into the script.
        env:
          FUZZ_WORK_DIR: ${{ runner.temp }}/fuzz
          FUZZ_SECONDS: ${{ inputs.seconds || '300' }}
          FUZZ_TARGETS: ${{ inputs.targets }}
        run: |
          [[ "$FUZZ_SECONDS" =~ ^[0-9]+$ ]] || { echo "seconds must be an integer"; exit 1; }
          [[ "$FUZZ_TARGETS" =~ ^[a-z_\ ]*$ ]] || { echo "invalid target list"; exit 1; }
          # shellcheck disable=SC2086 # word splitting of the validated target list is intended
          uv run fuzz/run.sh "$FUZZ_SECONDS" $FUZZ_TARGETS
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            ${{ runner.temp }}/fuzz/*/artifacts/
            ${{ runner.temp }}/fuzz/*/log.txt
