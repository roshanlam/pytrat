[project]
name = "pytrat-cli"
version = "0.1.0"
description = "Developer CLI for PyTraT."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Roshan Lamichhane", email = "roshanlamichhanenepali@gmail.com" }]
keywords = ["oauth", "transaction-tokens", "txn-token", "jwt", "authorization", "zero-trust", "microservices", "ai-agents"]
requires-python = ">=3.12"
dependencies = ["pytrat-core>=0.1.0,<0.2", "pytrat-policy>=0.1.0,<0.2", "pytrat-client>=0.1.0,<0.2", "pytrat-server>=0.1.0,<0.2", "typer>=0.12"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/roshanlam/pytrat"
Documentation = "https://github.com/roshanlam/pytrat/tree/main/docs"
Source = "https://github.com/roshanlam/pytrat"
Issues = "https://github.com/roshanlam/pytrat/issues"
Changelog = "https://github.com/roshanlam/pytrat/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytrat"]

[tool.uv.sources]
pytrat-client = { workspace = true }
pytrat-core = { workspace = true }
pytrat-policy = { workspace = true }
pytrat-server = { workspace = true }

[project.scripts]
pytrat = "pytrat.cli:main"
