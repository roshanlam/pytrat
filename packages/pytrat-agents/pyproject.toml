[project]
name = "pytrat-agents"
version = "0.1.0"
description = "Experimental AI-agent profile for Transaction Tokens (draft-araut-oauth-transaction-tokens-for-agents-03)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pytrat-core", "pyyaml>=6.0.2"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Typing :: Typed",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytrat"]

[tool.uv.sources]
pytrat-core = { workspace = true }