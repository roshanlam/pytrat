[project]
name = "pytrat-otel"
version = "0.1.0"
description = "OpenTelemetry audit sink for PyTraT: span events and decision metrics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# The API only. Applications choose and configure the SDK and exporters.
dependencies = ["pytrat-core", "opentelemetry-api>=1.27"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytrat"]

[tool.uv.sources]
pytrat-core = { workspace = true }
