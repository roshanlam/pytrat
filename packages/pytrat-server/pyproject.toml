[project]
name = "pytrat-server"
version = "0.1.0"
description = "Reference Transaction Token Service (TTS) for PyTraT."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pytrat-core", "pytrat-policy", "pytrat-agents", "fastapi>=0.115", "uvicorn>=0.32", "aiosqlite>=0.20", "pyyaml>=6.0.2", "python-multipart>=0.0.18"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Typing :: Typed",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytrat"]

[tool.uv.sources]
pytrat-agents = { workspace = true }
pytrat-core = { workspace = true }
pytrat-policy = { workspace = true }