[project]
name = "pytrat-policy"
version = "0.1.0"
description = "Policy-as-code for PyTraT: YAML policy model, compiler and evaluator."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pytrat-core", "pyyaml>=6.0.2"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Typing :: Typed",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytrat"]

[tool.uv.sources]
pytrat-core = { workspace = true }