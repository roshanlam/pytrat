[project]
name = "pytrat-core"
version = "0.1.0"
description = "Transaction Token models, verification, scopes, context binding and audit events."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pyjwt[crypto]>=2.10", "pydantic>=2.9"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Typing :: Typed",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytrat"]
